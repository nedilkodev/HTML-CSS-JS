<!DOCTYPE html>
<html lang=en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
        color: #2c3e50;
      }

      h1 {
        font-size: 26px;
        color: #0a2540;
        margin-bottom: 5px;
      }

      p {
        font-size: 14px;
        color: #627d98;
        margin-bottom: 20px;
      }
      hr {
        border: 0;
        border-top: 1px solid #e4e7eb;
        margin-bottom: 30px;
      }

      label {
        display: block;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 20px;
      }
      label.half {
        display: inline-block;
        width: 48%;
      }
      label.half + label.half {
        margin-left: 3%;
      }

      input,
      select,
      textarea {
        display: block; 
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border: 1px solid #bcd0e3;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box; 
      }

      textarea {
        min-height: 120px;
      }

      button {
        display: block;
        background-color: #1cb754;
        color: white;
        border: none;
        padding: 12px 50px;
        font-size: 15px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        margin: 30px auto 0 auto;
      }

      button:hover {
        background-color: #159643;
      }
    </style>
  </head>
  <body>
    <h1>RSVP</h1>
    <p>Please let us know if you will be able to make it.</p>
    <hr />
    <form action="#" method="POST">
      <label class="half"
        >First Name <input type="text" name="first_name" required /> </label
      ><label class="half"
        >Last Name
        <input type="text" name="last_name" required />
      </label>
      <label
        >E-mail
        <input
          type="email"
          name="email"
          placeholder="пример: myname@example.com"
          required
        />
      </label>
      <label
        >Phone Number
        <input type="tel" name="phone" placeholder="(000) 000-0000" />
      </label>
      <label
        >Number of people attending:
        <select name="attendees">
          <option value="" disabled selected>Please, select</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3+</option>
        </select>
      </label>
      <label
        >What are the names of the other people coming, if any?
        <textarea name="other_names"></textarea>
      </label>
      <label
        >Anything you want to add?
        <textarea name="comments"></textarea>
      </label>
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
